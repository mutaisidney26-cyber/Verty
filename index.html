    canvas {

    #controls {

      border: 1px solid rgba(255,255,255,0.16);
      padding: 6px 12px;
      border-radius: 999px;
      z-index: 20;
    }
    #controls.hidden { opacity: 0; pointer-events: none; }
    button {
      background: #ffffff;
      color: #0e0e12;
      border: none;
      padding: 5px 12px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }
    button.secondary {
      background: rgba(255,255,255,0.14);
      color: #ffffff;
    }
    #timer {
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      color: #ccc;
      min-width: 68px;
      text-align: center;
    }
  </style>
</head>

  </div>
